name: Plugin checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: audio-to-piano
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install regression dependencies
        run: python -m pip install numpy==1.26.4 scipy==1.17.1 pretty-midi==0.2.11.post0 mido==1.3.3
      - name: Run regression tests
        working-directory: audio-to-piano
        run: python tests/test_regressions.py
      - name: Check CLI entry point
        working-directory: audio-to-piano
        run: python skills/audio-to-piano/scripts/piano.py --help
      - name: Validate and package plugin
        working-directory: audio-to-piano
        run: python tests/package_plugin.py . /tmp/audio-to-piano-0.1.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: audio-to-piano-0.1.0
          path: /tmp/audio-to-piano-0.1.0.zip
